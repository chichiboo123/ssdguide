<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Open book: left page -->
  <path d="M5 22 L5 10 C8 9.2 12 9 16 9 L16 21 C12 21 8 21.5 5 22 Z" fill="white" opacity="0.92"/>
  <!-- Open book: right page -->
  <path d="M27 22 L27 10 C24 9.2 20 9 16 9 L16 21 C20 21 24 21.5 27 22 Z" fill="white" opacity="0.65"/>
  <!-- Book spine shadow -->
  <line x1="16" y1="9" x2="16" y2="21" stroke="#6366F1" stroke-width="1" opacity="0.4"/>

  <!-- Lines on left page -->
  <line x1="7.5" y1="13" x2="13.5" y2="12.7" stroke="#6366F1" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <line x1="7.5" y1="15.8" x2="13.5" y2="15.5" stroke="#6366F1" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <line x1="7.5" y1="18.5" x2="13.5" y2="18.3" stroke="#6366F1" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>

  <!-- Pencil on right page -->
  <g transform="translate(22.5, 14) rotate(35)">
    <!-- Eraser -->
    <rect x="-2" y="-7" width="4" height="2.2" rx="0.6" fill="#FECACA"/>
    <!-- Ferrule (metal band) -->
    <rect x="-2" y="-4.8" width="4" height="1.4" fill="#D1D5DB"/>
    <!-- Pencil body -->
    <rect x="-2" y="-3.4" width="4" height="8.4" rx="0.5" fill="#FDE68A"/>
    <!-- Pencil stripe -->
    <rect x="-2" y="-0.6" width="4" height="1" fill="#FCD34D" opacity="0.7"/>
    <!-- Tip wood -->
    <polygon points="-2,5 2,5 0,8.4" fill="#D4A373"/>
    <!-- Lead tip -->
    <polygon points="-0.8,7 0.8,7 0,8.6" fill="#374151"/>
  </g>
</svg>
